[package]
name = "arctn-py"
version = "1.0.0"
edition = "2021"
authors = ["Zhengyi Liu"]
description = "Python bindings for the ArcTN tensor-network contraction library"
license = "LicenseRef-Arclight-NC-Source-1.0"
readme = "README.md"
build = "build.rs"
# PyO3 0.29 requires Rust 1.83 or newer.
rust-version = "1.83"
homepage = "https://github.com/Quill-ArcLight/ArcTN"
publish = false

# Keep PyO3 out of the core library dependency graph.
[lib]
name = "arctn_py"
crate-type = ["cdylib"]

[dependencies]
arctn = { path = "..", version = "=1.0.0", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"] }
# NumPy conversion for DenseTensor execution.
numpy = "0.29"
num-complex = "0.4"

[features]
# Match the public Rust defaults, while allowing --no-default-features here.
# A separately built Light/Heavy engine selects its own features.
default = ["integer-order-dp"]
integer-order-dp = ["arctn/integer-order-dp"]
integer-tree-cost = ["arctn/integer-tree-cost"]
# Optional benchmark/production build: enable matrixmultiply's inner-GEMM
# thread tree in the ArcTN dependency. It is deliberately not a default
# feature because sliced outer parallelism needs a separate oversubscription
# policy.
mt = ["arctn/mt"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
