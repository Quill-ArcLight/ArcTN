# Both Cargo manifests are checked. Unknown licenses/sources fail.
[graph]
all-features = true
targets = []

[advisories]
ignore = []

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
exceptions = [
    { name = "arctn", version = "=1.0.0", allow = ["LicenseRef-Arclight-NC-Source-1.0"] },
    { name = "arctn-py", version = "=1.0.0", allow = ["LicenseRef-Arclight-NC-Source-1.0"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
